name: Pre-Merge Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  ENV: dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS OIDC Auth
        uses: ./.github/actions/aws-oidc-auth
        with:
          role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Setup Terraform + Init
        uses: ./.github/actions/setup-terraform
        with:
          environment: ${{ env.ENV }}

      - name: Terraform Format Check
        id: fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: tflint
        id: tflint
        working-directory: terraform
        run: tflint --recursive

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy Config Scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignore: .trivyignore.yaml

  plan:
    runs-on: ubuntu-latest
    outputs:
      plan-summary: ${{ steps.plan.outputs.stdout }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS OIDC Auth
        uses: ./.github/actions/aws-oidc-auth
        with:
          role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Setup Terraform + Init
        uses: ./.github/actions/setup-terraform
        with:
          environment: ${{ env.ENV }}

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        run: |
          terraform plan \
            -var-file=environments/${{ env.ENV }}/terraform.tfvars \
            -out=../tfplan-${{ env.ENV }} \
            -no-color

      - name: Store Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}
          path: tfplan-${{ env.ENV }}
          retention-days: 1

  comment:
    runs-on: ubuntu-latest
    needs: [lint, security, plan]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}

      - name: Post PR Comment
        uses: GetTerminus/terraform-pr-commenter@v3
        with:
          commenter_type: plan
          commenter_input: ${{ needs.plan.outputs.plan-summary }}
          commenter_exitcode: ${{ needs.plan.result == 'failure' && '1' || (needs.lint.result == 'failure' && '1' || (needs.security.result == 'failure' && '1' || '0')) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TF_WORKSPACE: ${{ env.ENV }}

      - name: Fail if any job failed
        if: >
          needs.lint.result == 'failure' ||
          needs.security.result == 'failure' ||
          needs.plan.result == 'failure'
        run: exit 1
